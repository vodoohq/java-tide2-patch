name: Build and test Fabric 26.3
on:
  push:
    branches: [voodoo/26.3-port]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      client_smoke_tests:
        description: Attempt client graphics tests on the hosted runner
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
      - name: Build and server GameTests
        run: bash gradlew build :fabric-26.3:runGameTest --console=plain
      - name: Client GameTests
        if: github.event_name == 'workflow_dispatch' && inputs.client_smoke_tests
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          SDL_VIDEODRIVER: x11
          MESA_GL_VERSION_OVERRIDE: '3.3'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libgl1-mesa-dri libglx-mesa0 mesa-utils xvfb
          xvfb-run -a -s '-screen 0 1280x720x24 +extension GLX' bash gradlew :fabric-26.3:runClientGameTest --console=plain
      - name: Package Tide release
        run: node scripts/package-release.mjs
      - uses: actions/upload-artifact@v7
        with:
          name: tide-fabric-26.3
          path: |
            build/tide-release/tide-*.jar
            build/tide-release/SHA256SUMS.txt
      - name: Upload screenshots and test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-evidence
          path: |
            fabric-26.3/build/run/clientGameTest/screenshots/
            fabric-26.3/build/reports/
          if-no-files-found: ignore
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: tide-fabric-26.3
          path: build/tide-release
      - name: Publish alpha assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --prerelease --title "Tide 2 Fabric 26.3 — Voodoo alpha" --notes-file RELEASE-NOTES.md
          fi
          gh release upload "$GITHUB_REF_NAME" build/tide-release/tide-*.jar build/tide-release/SHA256SUMS.txt --clobber
