plugins {
    id 'net.fabricmc.fabric-loom' version '1.17.21'
}

version = '2.1.1+voodoo.26.3.alpha.1'
group = 'com.li64.tide'
base.archivesName = 'tide-fabric-26.3'

repositories {
    mavenCentral()
    maven { url = 'https://api.modrinth.com/maven' }
}

dependencies {
    minecraft 'com.mojang:minecraft:26.3'
    implementation 'net.fabricmc:fabric-loader:0.19.5'
    implementation 'net.fabricmc.fabric-api:fabric-api:0.162.0+26.3'
    implementation 'maven.modrinth:cloth-config:fg2uyxOW'
    compileOnly 'maven.modrinth:modmenu:kyy7dbrZ'
    compileOnly 'maven.modrinth:serene-seasons:V9PxJPuw'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    withSourcesJar()
}

loom {
    accessWidenerPath = file('../src/main/resources/accesswideners/tide-26.3.classtweaker')
}

sourceSets.main {
    java.srcDirs = ['../src/main/java']
    // Generated resources are reused as migration inputs; they still require validation.
    resources.srcDirs = ['src/main/resources', '../src/main/resources', '../src/generated-1.21.1/resources', '../src/main/resources-26.2']
    java.exclude { entry -> !entry.isDirectory() && entry.path.startsWith('com/li64/tide/datagen/') && !entry.path.endsWith('/SimpleDataOutput.java') }
    java.exclude 'com/li64/tide/compat/fishingreal/FishingRealConversions.java'
    resources.exclude 'META-INF/**', 'tide-neoforge.mixins.json'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-Xmaxerrs', '1000']
}

tasks.named('processResources') {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    filesMatching('fabric.mod.json') {
        expand version: project.version
    }
}

tasks.named('jar') {
    from('../LICENSE.txt')
}

tasks.named('sourcesJar') {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from('../LICENSE.txt')
}

fabricApi {
    configureTests {
        createSourceSet = true
        modId = 'tide-port-tests'
        enableGameTests = true
        enableClientGameTests = true
    }
}

// Optional integration run against an existing pack; does not alter that instance.
def packModsDirectory = System.getenv('TIDE_PACK_MODS')
if (packModsDirectory) {
    def packMods = fileTree(packModsDirectory) {
        include '*.jar'
        exclude 'fabric-api-*', 'cloth-config-*', 'tide-fabric-*'
        if (System.getenv('TIDE_PACK_SKIP_WORLD_MAP') == '1') exclude 'xaeroworldmap-*'
    }.files.collect { it.absolutePath }.join(File.pathSeparator)
    loom.runs.named('clientGameTest') {
        vmArg "-Dfabric.addMods=${packMods}"
    }
}
